name: update preseason data

on:
  schedule:
    # Every 2 hours. Sportando's feed holds under a day of articles, so a
    # daily job would miss announcements outright — and results land in the
    # league calendars the same night a game is played, so the gap between
    # runs is the floor on how quickly a score can appear.
    #
    # Affordable because the recheck interval is tiered by source rather than
    # flat: league calendars every 2h, club pages every 10h, and articles and
    # tweets never, since neither is ever edited.
    - cron: "17 */2 * * *"
    # A second entry so the daily archive crawl has a schedule of its own.
    - cron: "17 0 * * *"
  workflow_dispatch:

# The job commits its own results back to the repo.
permissions:
  contents: write
  issues: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # A job with no ceiling can hang forever, and because runs share a
    # concurrency group a hung one blocks every run queued behind it. On 19.8
    # the browser step hung and the site went eight hours without an update
    # while three runs piled up waiting for it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Three layers, cheapest and most reliable first. Each is additive: a
      # layer that fails leaves the others' candidates intact.
      # The leagues own calendars are the most authoritative source, and most
      # leagues have not published one yet — so this hunts for them every run
      # and adopts each the day it appears.
      - name: Hunt for league preseason calendars
        timeout-minutes: 10
        continue-on-error: true
        run: node scripts/leagues.mjs | tee leagues.log

      - name: Sweep the outlet feeds
        timeout-minutes: 12
        run: node scripts/collect.mjs | tee collect.log

      - name: Refresh the club registry
        timeout-minutes: 6
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/clubs.mjs | tee clubs.log

      - name: Scan the clubs' fixture pages
        timeout-minutes: 15
        continue-on-error: true
        run: node scripts/clubscan.mjs | tee clubscan.log

      # Nitter mirrors go down constantly. This layer is allowed to fail
      # entirely without taking the run with it.
      - name: Read the clubs' social feeds
        timeout-minutes: 12
        continue-on-error: true
        run: node scripts/twitter.mjs | tee twitter.log

      # Crawling every sitemap is expensive and the archive barely changes, so
      # this runs once a day rather than every four hours. Articles are cached
      # permanently, so repeat passes only cost the crawl itself.
      # A real browser, only for the clubs whose fixture page is injected by
      # JavaScript and reads as empty otherwise. Expensive and its answer barely
      # changes hour to hour, so it shares the daily slot with the archive crawl.
      - name: Render the JavaScript-only club pages
        timeout-minutes: 20
        if: github.event.schedule == '17 0 * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # No --with-deps: it shells out to apt-get, and on 19.8 apt stalled
          # on an Ubuntu mirror for four and a half hours, holding the whole
          # queue behind it. GitHub's runners already ship the libraries
          # Chromium needs; --with-deps is for bare containers.
          npm ci --omit=optional 2>/dev/null || npm install
          npx playwright install chromium
          node scripts/render.mjs | tee render.log

      - name: Backfill the archives
        timeout-minutes: 15
        if: github.event.schedule == '17 0 * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node scripts/backfill.mjs | tee backfill.log

      - name: Read the new articles
        timeout-minutes: 20
        id: extract
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Never fail the run on extraction trouble: a rate-limited or missing
        # key must still leave yesterday's data intact and published.
        continue-on-error: true
        run: node scripts/extract.mjs | tee extract.log

      # Composes seed + manual + extracted into games.json and teams.json.
      # Runs even when extraction failed, so a throttled key still republishes
      # yesterday's data rather than leaving the site stale or empty.
      - name: Rebuild the data files
        timeout-minutes: 8
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/build.mjs | tee build.log

      # The checks run against what is about to be published, not after. A
      # run that would publish broken data fails here instead.
      - name: Check data integrity
        timeout-minutes: 5
        run: node scripts/check.mjs --local | tee check.log

      # A run takes twenty minutes, so a human push during it will reject this
      # one. The data files are regenerated from their inputs, so the recovery
      # is to take the new head and rebuild on top rather than to merge
      # generated JSON — there is nothing to reconcile, only to recompute.
      - name: Commit if anything changed
        id: commit
        run: |
          git config user.name "preseason-bot"
          git config user.email "actions@github.com"

          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no change"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          for attempt in 1 2 3; do
            git add data/
            git diff --cached --quiet && { echo "nothing left to commit"; exit 0; }
            git commit -m "data: automatic update $(date -u +'%Y-%m-%d %H:%M')"
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected — rebuilding on the new head (attempt $attempt)"
            git reset --hard HEAD~1
            git fetch origin master
            git reset --hard origin/master
            node scripts/build.mjs || true
          done
          echo "::error::could not push after 3 attempts"
          exit 1

      # A source that has gone quiet for days is indistinguishable from a
      # source that broke, unless somebody is told. Nobody is watching, so the
      # run files an issue against itself.
      - name: Report dead sources
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e "
            const fs=require('fs');
            const h=JSON.parse(fs.readFileSync('data/candidates.json','utf8')).health;
            const dead=h.filter(x=>!x.ok);
            if(!dead.length){console.log('all sources reachable');process.exit(0)}
            fs.writeFileSync('dead.txt', dead.map(d=>'- '+d.id+': '+d.why).join('\n'));
            console.log(dead.length+' unreachable');
          "
          if [ -f dead.txt ]; then
            existing=$(gh issue list --state open --label sources --limit 1 --json number --jq '.[0].number')
            body="Sources the collector could not reach on $(date -u +'%Y-%m-%d %H:%M') UTC:"$'\n\n'"$(cat dead.txt)"
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$body"
            else
              gh label create sources --color ededed --description "collector health" 2>/dev/null || true
              gh issue create --title "Unreachable sources" --label sources --body "$body"
            fi
          fi
