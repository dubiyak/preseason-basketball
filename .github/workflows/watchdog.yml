name: watchdog

# Deliberately separate from the update workflow, with NO concurrency group.
# The stall it exists to catch was a hung step holding the update queue for
# eight hours — a check living inside that queue would have been stuck behind
# the very thing it was meant to report.
on:
  schedule:
    - cron: "40 */2 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Is the published site still fresh?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          URL="https://dubiyak.github.io/preseason-basketball/data/games.json"
          if ! curl -fsS -m 30 "$URL?cb=$RANDOM" -o live.json; then
            echo "state=unreachable" >> "$GITHUB_OUTPUT"
            echo "detail=the published games.json could not be fetched at all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The update schedule is uneven on purpose: six runs bunched around
          # the evening, with a nine-hour daylight gap between the 07:00 and
          # 16:00 Israel slots. A flat hour threshold would have to be loose
          # enough to sit through that gap, and would therefore also sit
          # through a real stall until the small hours. lib/schedule.mjs holds
          # the slots and answers the only question worth asking: has a run
          # come due and failed to publish?
          node --input-type=module -e '
            import fs from "node:fs";
            import os from "node:os";
            import { freshness } from "./lib/schedule.mjs";
            const j = JSON.parse(fs.readFileSync("live.json", "utf8"));
            const { stale, hours, due } = freshness(j.updated);
            const put = (line) => {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, line + os.EOL);
              console.log(line);
            };
            put(`state=${stale ? "stale" : "fresh"}`);
            put(`detail=last published ${hours.toFixed(1)}h ago (${j.updated}), ` +
                `${j.games.length} games; last run due ${due ?? "none yet"}`);
          '

      # One issue, reopened and commented rather than a new one each time — an
      # alert that floods is an alert that gets muted.
      - name: Raise or clear the alarm
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.check.outputs.state }}
          DETAIL: ${{ steps.check.outputs.detail }}
        run: |
          gh label create stale --color d73a4a --description "the published site stopped updating" 2>/dev/null || true
          NUM=$(gh issue list --state all --label stale --limit 1 --json number --jq '.[0].number // empty')

          if [ "$STATE" = "fresh" ]; then
            if [ -n "$NUM" ] && [ "$(gh issue view "$NUM" --json state --jq .state)" = "OPEN" ]; then
              gh issue comment "$NUM" --body "Updating again — $DETAIL"
              gh issue close "$NUM"
            fi
            echo "fresh: $DETAIL"
            exit 0
          fi

          BODY="The published site has stopped updating.

          $DETAIL

          The update workflow runs six times a day (03:00, 07:00, 16:00, 19:00,
          22:00 and 00:00 Israel time). When this fires, the usual cause is a
          run that hung and is holding the queue: check
          https://github.com/dubiyak/preseason-basketball/actions for a run stuck
          in progress, and cancel it to release the ones behind it."

          if [ -n "$NUM" ]; then
            gh issue reopen "$NUM" 2>/dev/null || true
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "Site stopped updating" --label stale --body "$BODY"
          fi
          echo "::warning::$DETAIL"
